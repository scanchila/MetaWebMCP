services:
  metawebmcp:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      BROWSER_MCP_URL: http://playwright-mcp:8931/mcp
      BROWSER_MCP_EGRESS_ISOLATED: "1"
    depends_on:
      - playwright-mcp
    networks:
      - default
      - browser-internal

  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp@sha256:dda1f7f9b812e22946635c8af7df9288b96d3b9e3f0f1b8576d6823e2031c1de
    user: node
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
      - /home/node/.cache:rw,nosuid,nodev,noexec,size=64m,mode=0700,uid=1000,gid=1000
      - /home/node/.config:rw,nosuid,nodev,noexec,size=64m,mode=0700,uid=1000,gid=1000
    shm_size: "512mb"
    entrypoint: ["node", "/app/cli.js"]
    command:
      - --headless
      - --browser
      - chromium
      - --sandbox
      - --isolated
      - --image-responses
      - omit
      - --port
      - "8931"
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - playwright-mcp:8931,localhost:8931,127.0.0.1:8931
      - --proxy-server
      - http://egress-proxy:8080
      - --proxy-bypass
      - <-loopback>
    depends_on:
      - egress-proxy
    networks:
      - browser-internal

  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile.egress
    expose:
      - "8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - browser-internal

networks:
  browser-internal:
    internal: true
